<script type="module">
import * as THREE from 'three';

function grainTexture(){

  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  for(let i=0;i<70;i++){ const y=rnd()*1024,h=8+rnd()*60; const gg=x.createLinearGradient(0,y-h,0,y+h); const a=0.05+rnd()*0.08; gg.addColorStop(0,'rgba(140,98,66,0)'); gg.addColorStop(.5,'rgba(140,98,66,'+a+')'); gg.addColorStop(1,'rgba(140,98,66,0)'); x.fillStyle=gg; x.fillRect(0,y-h,1024,2*h); }   // broad tone bands
